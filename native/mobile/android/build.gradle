// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Apply the reviewed, version-checked legacy callback guard before compiling
// Capacitor. npm ci restores dependencies; every Android build reapplies it.
def prepareRelayBridge = tasks.register('prepareRelayBridge', Exec) {
    workingDir rootProject.file('../../..')
    commandLine 'node', 'scripts/patch-android-bridge.mjs'
}
project(':capacitor-android').tasks.configureEach {
    if (name == 'preBuild') dependsOn prepareRelayBridge
}
